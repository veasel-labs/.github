name: Validate community files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Validate issue form YAML
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.safe_load_file(file, aliases: false) }'
          ISSUE_TEMPLATE/config.yml ISSUE_TEMPLATE/bug.yml ISSUE_TEMPLATE/feature.yml
      - name: Check required community files and Markdown links
        run: node scripts/check-community.mjs
      - name: Run community checks tests
        run: node --test scripts/*.test.mjs
